name: Korea Breakout Scan

on:
  workflow_dispatch:
  schedule:
    # KST 07:00 Mon-Fri = UTC 22:00 Sun-Thu
    - cron: "0 22 * * 0-4"
    # KST 12:00 / 16:00 Mon-Fri = UTC 03:00 / 07:00 Mon-Fri
    - cron: "0 3,7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: korea-breakout-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Run Korea scan pipeline
        working-directory: charts_today
        run: |
          python build_macro_watch_yahoo_korea.py
          python build_kr_foreign_naver_auto_v6_dateanchor_patched3.py --top 30
          python build_kr_strong_stocks_auto_v5.py
          python sync_tickers_txt_korea_v3.py
          python update_premarket_yf_auto_debug_korea_v5_dedup.py
          python scan_candidates_v2_safe_v6_sma1040.py --universe tickers_korea.txt --premarket premarket_auto_korea.csv
          python manual10_legacy_review_korea_v12_3_dmaall_color_brightstates.py \
            --manual premarket_auto_korea.csv \
            --report report_v2.csv \
            --overlay thesis_overlay_master.csv \
            --detail-top 3 | tee manual_review_korea_latest.txt

      - name: Copy generated Korea data to dashboard
        run: |
          mkdir -p bulkowski_breakout_radar/data/kr

          cp charts_today/report_v2.csv bulkowski_breakout_radar/data/kr/report_v2.csv
          cp charts_today/premarket_auto_korea.csv bulkowski_breakout_radar/data/kr/premarket_auto_korea.csv
          cp charts_today/premarket_auto_debug_korea.csv bulkowski_breakout_radar/data/kr/premarket_auto_debug_korea.csv
          cp charts_today/scan_skipped.log bulkowski_breakout_radar/data/kr/scan_skipped.log
          cp charts_today/tickers_korea.txt bulkowski_breakout_radar/data/kr/tickers_korea.txt
          cp charts_today/thesis_overlay_master.csv bulkowski_breakout_radar/data/kr/thesis_overlay_master.csv
          cp charts_today/manual_review_korea_latest.txt bulkowski_breakout_radar/data/kr/manual_review_korea_latest.txt

      - name: Build Korea ticker master
        run: |
          python bulkowski_breakout_radar/build_ticker_master_korea.py \
            --report bulkowski_breakout_radar/data/kr/report_v2.csv \
            --tickers bulkowski_breakout_radar/data/kr/tickers_korea.txt \
            --out bulkowski_breakout_radar/data/kr/ticker_master_korea.csv \
            --force-refresh

      - name: Repair Korea ticker metadata
        run: |
          python bulkowski_breakout_radar/repair_korea_master.py --path bulkowski_breakout_radar/data/kr/ticker_master_korea.csv --report bulkowski_breakout_radar/data/kr/report_v2.csv --tickers bulkowski_breakout_radar/data/kr/tickers_korea.txt --premarket bulkowski_breakout_radar/data/kr/premarket_auto_korea.csv --max-naver 500

      - name: Repair Korea report metadata
        run: |
          python bulkowski_breakout_radar/repair_korea_report_metadata.py --report bulkowski_breakout_radar/data/kr/report_v2.csv --master bulkowski_breakout_radar/data/kr/ticker_master_korea.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p bulkowski_breakout_radar/data/kr
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST' > bulkowski_breakout_radar/data/kr/last_updated_kst.txt
          date -u '+%Y-%m-%d %H:%M:%S UTC' > bulkowski_breakout_radar/data/kr/last_updated_utc.txt
          echo "workflow=${{ github.workflow }}" > bulkowski_breakout_radar/data/kr/last_updated_meta.txt
          echo "run_id=${{ github.run_id }}" >> bulkowski_breakout_radar/data/kr/last_updated_meta.txt
          echo "sha=${{ github.sha }}" >> bulkowski_breakout_radar/data/kr/last_updated_meta.txt

          # Only commit dashboard Korea data.
          # charts_today files are generated intermediates and can block rebase.
          git add bulkowski_breakout_radar/data/kr/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Korea breakout scan data"

            # Remove unstaged generated files before rebase.
            git reset --hard HEAD
            git clean -fd

            # Another workflow may have pushed while this job was running.
            git pull --rebase origin main
            git push origin main
          fi
